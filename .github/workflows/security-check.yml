name: Security check

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan history with redacted findings
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --log-opts=HEAD --redact=100 --no-banner --exit-code 1 .

  malware:
    name: Scan repository files for known malware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam
          sudo freshclam
      - name: Scan checked-out files
        run: clamscan --recursive --infected --no-summary --exclude-dir='(^|/)\.git($|/)' .
