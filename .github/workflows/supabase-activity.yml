name: Supabase activity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-activity.yml'
      - 'scripts/supabase-activity.mjs'
      - 'supabase/portal-activity-ping.sql'
  schedule:
    # Tuesday at 10:23 Malaysia time (UTC+8).
    - cron: '23 2 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity:
    name: Request a minimal database query
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Query without printing database records
        run: node scripts/supabase-activity.mjs
